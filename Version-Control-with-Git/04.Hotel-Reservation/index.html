<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="./static/css/styles.css">
    <title>Hotel reservation</title>
</head>

<body>
    <section id="welcome">
        <h1>&#9734; Welcome to our family hotel &#9734;</h1>
        <div class="home-container">
            <div class="info">
                <h1>Hotel reservation</h1>
            </div>
        </div>
    </section>

    <div class="site-content">
        <!-- Site Content -->
        <!-- Our Offers Form -->
        <div class="search-result-form-content custom-form hidden">
            <div class="background">
                <div class="shape"></div>
                <div class="shape"></div>
            </div>
            <div class="room-type-item">
                <img src="./static/img/budgetRoom.jpg" alt="room-image" />
                <p>Budget Room - 70$</p>
                <button class="room-type" id="budget-room">Choose</button>
            </div>
            <div class="room-type-item">
                <img src="./static/img/familyRoom.jpg" alt="room-image" />
                <p>Family Room - 150$</p>
                <button class="room-type" id="family-room">Choose</button>
            </div>
            <div class="room-type-item">
                <img src="./static/img/kingRoom.jpg" alt="room-image" />
                <p>King Room - 200$</p>
                <button class="room-type" id="king-room">Choose</button>
            </div>
        </div>
        <!-- Thank you, page! -->
        <div class="thank-you-content custom-form">
            <div class="background">
                <div class="shape"></div>
                <div class="shape"></div>
            </div>
            <form class="thank-you">
                <h3>Thank you for your reservation!</h3>
                <button id="new-reservation">Make new reservation</button>
            </form>
        </div>
    </div>
    <script src="solution.js"></script>
</body>

</html>
